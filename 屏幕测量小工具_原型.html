<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>屏幕测量小工具 · 原型 Demo v4</title>
<style>
  :root{
    --bg:#0f1720; --panel:#182430; --line:#2a3a4a; --accent:#37b0ff;
    --accent2:#37ff9b; --text:#e8eef4; --muted:#8aa0b4; --warn:#ffb020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;overflow:hidden;}
  .app{display:flex;height:100vh;}
  .sidebar{width:256px;background:var(--panel);border-right:1px solid var(--line);
    padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
  .brand{font-size:16px;font-weight:700;margin-bottom:6px;}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:3px;}
  .tool{padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:#101a24;cursor:pointer;font-size:13.5px;transition:.15s;}
  .tool:hover{border-color:var(--accent);}
  .tool.active{background:var(--accent);color:#001018;border-color:var(--accent);font-weight:700;}
  .tool .tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:10px;
    font-size:10px;background:var(--accent2);color:#04351f;font-weight:700;vertical-align:1px;}
  .group{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  .group h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;}
  .kv{font-size:12px;color:var(--muted);line-height:1.85;}
  .kv b{color:var(--text);font-family:Consolas,monospace;}
  .btn{margin-top:8px;width:100%;padding:8px;border-radius:7px;border:1px solid var(--line);
    background:#101a24;color:var(--text);cursor:pointer;font-size:13px;}
  .btn:hover{border-color:var(--warn);color:var(--warn);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .stage{flex:1;position:relative;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}
  .hint{position:absolute;top:12px;left:12px;background:rgba(20,30,40,.85);
    border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;
    max-width:420px;line-height:1.7;pointer-events:none;}
  .hint b{color:var(--accent);}
  .readout{position:absolute;right:14px;bottom:14px;background:rgba(20,30,40,.9);
    border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:14px;
    min-width:230px;max-width:330px;}
  .readout h5{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;}
  .readout .val{font-family:Consolas,monospace;font-size:18px;color:var(--accent2);}
  .readout .seg{font-family:Consolas,monospace;font-size:11px;color:var(--muted);
    margin-top:4px;max-height:130px;overflow:auto;}
  .badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
    background:#10304a;color:var(--accent);border:1px solid #23496b;}
  .badge.cal{background:#103a2a;color:var(--accent2);border-color:#236b4a;}
  #menu{position:absolute;display:none;z-index:50;background:#12202c;border:1px solid var(--accent);
    border-radius:8px;padding:4px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  #menu .mi{padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer;}
  #menu .mi:hover{background:var(--accent);color:#001018;}
  #menu .mi.warn:hover{background:var(--warn);color:#2a1800;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">测量小工具 · 原型 v4<small>Screen Measure Prototype</small></div>

    <div class="group">
      <h4>测量模式</h4>
      <div class="tool active" data-mode="ruler">1. 直尺（生成一把尺子）<span class="tag">改</span></div>
      <div class="tool" data-mode="polyline">2. 折线（连续多段）<span class="tag">改</span></div>
      <div class="tool" data-mode="pen">3. 画笔描边（连续画）</div>
      <div class="tool" data-mode="angle">4. 角度（三点算夹角）</div>
      <div class="tool" data-mode="area">5. 面积（多点围区域）</div>
      <div class="tool" data-mode="circle">6. 圆形（三点拟合圆）</div>
    </div>

    <div class="group">
      <h4>右键菜单</h4>
      <div class="kv" id="rmbTip">折线 / 画笔描边：绘制态右键可选<b>“编辑已有测量”</b>；编辑态右键可<b>“继续绘制”</b>或删该条。其它模式右键=清除当前。</div>
    </div>

    <div class="group">
      <h4>DPI 校准</h4>
      <div class="kv">当前比例：<b id="ratio">3.78</b> px/cm<br>
      校准物：银行卡 <b>8.56cm</b></div>
      <button class="btn" id="calBtn">用当前尺子长度对齐银行卡(8.56cm)校准</button>
      <button class="btn" id="resetBtn">清除当前测量</button>
    </div>

    <div class="group">
      <h4>说明</h4>
      <div class="kv">本原型用 Canvas 演示交互逻辑；<br>生产版建议用原生图形框架。<br>
      <span class="badge">原型</span> <span class="badge cal" id="calBadge">已用默认比例</span></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div id="menu"></div>
    <div class="readout">
      <h5 id="roTitle">测量结果</h5>
      <div class="val" id="roVal">--</div>
      <div class="kv" id="roSub">按左侧模式操作</div>
      <div class="seg" id="roSeg"></div>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const menu = document.getElementById('menu');
let W=0,H=0;
function resize(){ W=cv.width=cv.clientWidth; H=cv.height=cv.clientHeight; if(ruler) clampRuler(); draw(); }
window.addEventListener('resize', resize);

let pxPerCm = 3.78;
let mode = 'ruler';
let editOn = false;      // pen / polyline 的 编辑/绘制 切换（右键菜单驱动）
const HIT=10;

// ---- 直尺：一把真实的可拖动尺子 ----
let ruler=null;          // {x,y,len,angle}
let rDrag=null;          // 'move' | 'len' | 'rot'
let rStart=null;

// ---- 折线：支持多条，绘制态连续点，编辑态改形 ----
let polyShapes=[];       // [{pts:[]}]
let curPoly=[];          // 当前正在点的一条
let pDragShape=-1, pDragIdx=-1;

// ---- 画笔描边：多条，默认连续画，右键进编辑 ----
let penShapes=[];        // [{anchors:[],closed:false}]
let drawBuf=[];
let dragShape=-1, dragIdx=-1;

// ---- 通用三点/面积等 ----
let pts=[];
let dragging=false, cur=null;

const hints={
  ruler:'<b>直尺模式</b>：选中即生成一把尺子。拖动尺身=移动，拖<b>黄色右端</b>=改长度，拖<b>绿色左端圆点</b>=旋转。刻度随比例自动重排。',
  polyline:'<b>折线模式</b>：绘制态逐点点击连续追加，<b>双击</b>固化成一条，可接着点画<b>第二条</b>。<b>右键</b>选“编辑已有测量”改形；编辑态右键选“继续绘制”。',
  pen:'<b>画笔描边</b>：绘制态按住沿边缘画，松开固化成一条，可连续画<b>下一笔</b>。<b>右键</b>选“编辑已有测量”，可拖锚点/加点/删点/双击闭合；编辑态右键选“继续绘制”。',
  angle:'<b>角度模式</b>：依次点击 3 个点（边点→顶点→边点），算出夹角。',
  area:'<b>面积模式</b>：依次点击围出多边形顶点，双击闭合并算面积。',
  circle:'<b>圆形模式</b>：点击圆上 3 个点，拟合出直径/半径/周长/面积。'
};

function setMode(m){
  mode=m; editOn=false; pts=[]; curPoly=[]; penShapes=[]; drawBuf=[]; polyShapes=[];
  pDragShape=-1; pDragIdx=-1; dragShape=-1; dragIdx=-1; cur=null; dragging=false; rDrag=null;
  if(m==='ruler' && !ruler) initRuler();
  document.querySelectorAll('.tool').forEach(t=>t.classList.toggle('active', t.dataset.mode===m));
  document.getElementById('hint').innerHTML=hints[m];
  hideMenu();
  refresh();
  draw();
}
document.querySelectorAll('.tool').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));

function initRuler(){ ruler={x:W*0.28,y:H*0.5,len:18*pxPerCm,angle:0}; }
function clampRuler(){ if(!ruler)return; ruler.x=Math.max(20,Math.min(W-20,ruler.x)); ruler.y=Math.max(20,Math.min(H-20,ruler.y)); }

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function cm(px){ return (px/pxPerCm); }
function setReadout(title,val,sub,seg){
  document.getElementById('roTitle').textContent=title;
  document.getElementById('roVal').textContent=val;
  document.getElementById('roSub').textContent=sub||'';
  document.getElementById('roSeg').innerHTML=seg||'';
}
function refresh(){
  if(mode==='ruler'){ rulerReadout(); }
  else if(mode==='polyline'){ polyReadout(); }
  else if(mode==='pen'){ penReadout(); }
  else setReadout('测量结果','--','按提示操作');
}

// ===== 几何/算法 =====
function smooth(arr,w){ w=w||3; if(arr.length<2) return arr;
  const out=[]; for(let i=0;i<arr.length;i++){ let sx=0,sy=0,n=0;
    for(let j=Math.max(0,i-w);j<=Math.min(arr.length-1,i+w);j++){ sx+=arr[j].x; sy+=arr[j].y; n++; }
    out.push({x:sx/n,y:sy/n}); } return out; }
function pathLen(a){ let s=0; for(let i=1;i<a.length;i++) s+=dist(a[i-1],a[i]); return s; }
function catmullRom(P, closed, segs){ segs=segs||8; if(P.length<2) return P.slice();
  const ptsOut=[]; const n=P.length;
  const get=(i)=> closed ? P[((i%n)+n)%n] : P[Math.max(0,Math.min(n-1,i))];
  const last = closed ? n : n-1;
  for(let i=0;i<last;i++){ const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
    for(let t=0;t<segs;t++){ const s=t/segs,s2=s*s,s3=s2*s;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*s+(2*p0.x-5*p1.x+4*p2.x-p3.x)*s2+(-p0.x+3*p1.x-3*p2.x+p3.x)*s3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*s+(2*p0.y-5*p1.y+4*p2.y-p3.y)*s2+(-p0.y+3*p1.y-3*p2.y+p3.y)*s3);
      ptsOut.push({x:x,y:y}); } }
  ptsOut.push(closed?P[0]:P[n-1]); return ptsOut; }
function resample(arr, step){ step=step||16; if(arr.length<2) return arr.slice();
  const out=[arr[0]]; let acc=0;
  for(let i=1;i<arr.length;i++){ acc+=dist(arr[i-1],arr[i]); if(acc>=step){ out.push(arr[i]); acc=0; } }
  const last=arr[arr.length-1]; if(dist(out[out.length-1],last)>step*0.4) out.push(last); return out; }
function midOf(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function shapeLen(sh){ return pathLen(catmullRom(sh.anchors, sh.closed && sh.anchors.length>=3, 10)); }
function commitStroke(){ const sp=smooth(drawBuf,4); const anchors=resample(sp,16);
  if(anchors.length>=2) penShapes.push({anchors:anchors, closed:false}); drawBuf=[]; }
function polyArea(a){ let s=0; for(let i=0;i<a.length;i++){ const j=(i+1)%a.length; s+=a[i].x*a[j].y-a[j].x*a[i].y; } return Math.abs(s/2); }
function circleFrom3(p1,p2,p3){
  const a=p2.x-p1.x,b=p2.y-p1.y,c=p3.x-p1.x,d=p3.y-p1.y;
  const e=(p2.x*p2.x-p1.x*p1.x+p2.y*p2.y-p1.y*p1.y)/2;
  const f=(p3.x*p3.x-p1.x*p3.x+p3.y*p3.y-p3.y*p3.y+ (p3.x*p1.x*0)) ; const ff=(p3.x*p3.x-p1.x*p1.x+p3.y*p3.y-p1.y*p1.y)/2;
  const det=a*d-b*c; if(Math.abs(det)<1e-6) return null;
  const cx=(d*e-b*ff)/det, cy=(a*ff-c*e)/det; const r=Math.hypot(cx-p1.x,cy-p1.y); return {cx,cy,r}; }
function angleOf(a,b,c){ const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  const dot=v1.x*v2.x+v1.y*v2.y; const m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
  return Math.acos(Math.max(-1,Math.min(1,dot/m)))*180/Math.PI; }
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

// ===== 读数 =====
function rulerReadout(){
  if(!ruler){ setReadout('直尺','--','选中直尺自动生成'); return; }
  setReadout('尺子长度', cm(ruler.len).toFixed(2)+' cm',
    '像素 '+ruler.len.toFixed(0)+' px · 角度 '+(ruler.angle*180/Math.PI).toFixed(0)+'° · 可拖动/旋转');
}
function polyReadout(){
  let total=0, segHtml='', nSeg=0;
  for(let s=0;s<polyShapes.length;s++){ const P=polyShapes[s].pts; let L=pathLen(P); total+=L; nSeg+=P.length-1;
    segHtml += ('第'+(s+1)+'条：'+cm(L).toFixed(2)+' cm（'+P.length+'点）<br>'); }
  const drawing = curPoly.length>=1;
  let curL=0; if(curPoly.length>=2){ curL=pathLen(curPoly); }
  if(polyShapes.length===0 && !drawing){ setReadout('折线总长','--', editOn?'（编辑）先画一条折线':'逐点点击，双击固化，可画多条'); draw(); return; }
  setReadout('折线总长', cm(total+curL).toFixed(2)+' cm',
    '像素 '+(total+curL).toFixed(0)+' px · 折线 '+polyShapes.length+' 条 · 段数 '+nSeg+
    (drawing?(' · 正在点第'+(polyShapes.length+1)+'条（'+curPoly.length+'点，双击结束）'):'')+
    (editOn?'（拖点/中点+/右键删点）':'（右键选“编辑”改形）'), segHtml);
  draw();
}
function penReadout(){
  let total=0, segHtml='', nAnchor=0, nClosed=0;
  for(let s=0;s<penShapes.length;s++){ const L=shapeLen(penShapes[s]); total+=L; nAnchor+=penShapes[s].anchors.length;
    if(penShapes[s].closed) nClosed++;
    segHtml += ('第'+(s+1)+'笔：'+cm(L).toFixed(2)+' cm（'+penShapes[s].anchors.length+'锚点'+(penShapes[s].closed?'·闭合':'')+'）<br>'); }
  const drawing = (!editOn && drawBuf.length>1);
  if(penShapes.length===0 && !drawing){ setReadout('描边总长','--', editOn?'（编辑）先画一条描边':'按住沿边缘画，可连续画多笔'); draw(); return; }
  setReadout('描边总长', cm(total).toFixed(2)+' cm',
    '像素 '+total.toFixed(0)+' px · 描边 '+penShapes.length+' 笔（闭合 '+nClosed+'）· 锚点 '+nAnchor+
    (drawing?' · 正在画下一笔…':'')+
    (editOn?'（拖锚点/中点+/右键删点/双击闭合）':'（右键选“编辑”改形）'), segHtml);
  draw();
}
function computeAngle(){ const ang=angleOf(pts[0],pts[1],pts[2]); setReadout('夹角', ang.toFixed(1)+'°', '顶点在第2个点'); draw(); }
function computeCircle(){ const c=circleFrom3(pts[0],pts[1],pts[2]);
  if(!c){ setReadout('圆形','三点共线','请重新选不共线的3点'); return; }
  setReadout('圆形', (2*cm(c.r)).toFixed(2)+' cm 直径',
    '半径 '+cm(c.r).toFixed(2)+' cm · 周长 '+cm(2*Math.PI*c.r).toFixed(2)+' cm · 面积 '+cm(Math.PI*c.r*c.r).toFixed(2)+' cm²'); draw(); }

// ===== 右键菜单 =====
function showMenu(px,py,items){
  menu.innerHTML='';
  items.forEach(it=>{ const d=document.createElement('div'); d.className='mi'+(it.warn?' warn':'');
    d.textContent=it.label; d.onclick=()=>{ hideMenu(); it.fn(); }; menu.appendChild(d); });
  menu.style.display='block';
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  menu.style.left=Math.min(px, W-mw-8)+'px';
  menu.style.top=Math.min(py, H-mh-8)+'px';
}
function hideMenu(){ menu.style.display='none'; }
function goEdit(){
  if(mode!=='pen'&&mode!=='polyline') return;
  if(mode==='pen' && drawBuf.length>=3) commitStroke();
  editOn=true; refresh(); draw();
}
function goDraw(){ editOn=false; pDragShape=-1;pDragIdx=-1;dragShape=-1;dragIdx=-1; refresh(); draw(); }
function clearCurrent(){ pts=[]; curPoly=[]; penShapes=[]; drawBuf=[]; polyShapes=[]; editOn=false;
  pDragShape=-1;pDragIdx=-1;dragShape=-1;dragIdx=-1; refresh(); draw(); }
function delHitShape(p){
  if(mode==='polyline'){ for(let s=0;s<polyShapes.length;s++){ if(hitPoly(p,{shape:s,idx:-1})>=0){ polyShapes.splice(s,1); polyReadout(); return true; } } }
  if(mode==='pen'){ for(let s=0;s<penShapes.length;s++){ if(hitPen(p)>=0){ penShapes.splice(s,1); penReadout(); return true; } } }
  return false;
}
function hitPen(p){ for(let s=0;s<penShapes.length;s++){ const sh=penShapes[s];
  for(let i=0;i<sh.anchors.length;i++){ if(dist(sh.anchors[i],p)<HIT) return s; } } return -1; }
function hitPoly(p){ for(let s=0;s<polyShapes.length;s++){ const P=polyShapes[s].pts;
  for(let i=0;i<P.length;i++){ if(dist(P[i],p)<HIT) return s; } } return -1; }

cv.addEventListener('contextmenu',e=>{
  e.preventDefault(); const p=pos(e);
  if(mode==='pen'||mode==='polyline'){
    const items=[];
    if(editOn){
      items.push({label:'继续绘制（返回画新的）', fn:goDraw});
      const hitS = mode==='pen'?hitPen(p):hitPoly(p);
      if(hitS>=0) items.push({label:'删除命中的这一条', warn:true, fn:()=>{
        if(mode==='pen') penShapes.splice(hitS,1); else polyShapes.splice(hitS,1); refresh(); draw(); }});
      items.push({label:'清除全部', warn:true, fn:clearCurrent});
    }else{
      const hasContent = mode==='pen'?(penShapes.length||drawBuf.length>1):(polyShapes.length||curPoly.length>0);
      if(hasContent) items.push({label:'编辑已有测量', fn:goEdit});
      items.push({label:'清除当前', warn:true, fn:clearCurrent});
    }
    showMenu(e.clientX-cv.getBoundingClientRect().left, e.clientY-cv.getBoundingClientRect().top, items);
    return;
  }
  showMenu(e.clientX-cv.getBoundingClientRect().left, e.clientY-cv.getBoundingClientRect().top,
    [{label:'清除当前测量', warn:true, fn:clearCurrent}]);
});
cv.addEventListener('mousedown',e=>{ if(e.button===0) hideMenu(); });

// ===== 主交互 =====
function rulerEnds(){ const ux=Math.cos(ruler.angle),uy=Math.sin(ruler.angle);
  return {o:{x:ruler.x,y:ruler.y}, r:{x:ruler.x+ux*ruler.len,y:ruler.y+uy*ruler.len}}; }

cv.addEventListener('mousedown',e=>{
  const p=pos(e);
  if(mode==='ruler'){
    if(!ruler) return;
    const E=rulerEnds();
    if(dist(p,E.r)<12){ rDrag='len'; return; }
    if(dist(p,E.o)<12){ rDrag='rot'; return; }
    // 在尺身附近 -> 移动
    if(distToSeg(p,E.o,E.r)<18){ rDrag='move'; rStart={mx:p.x,my:p.y,ox:ruler.x,oy:ruler.y}; return; }
    rDrag='move'; rStart={mx:p.x,my:p.y,ox:ruler.x,oy:ruler.y};
  }
  else if(mode==='polyline'){
    if(editOn){
      for(let s=0;s<polyShapes.length;s++){ const P=polyShapes[s].pts;
        for(let i=0;i<P.length;i++){ if(dist(P[i],p)<HIT){ pDragShape=s;pDragIdx=i;dragging=true; return; } } }
      for(let s=0;s<polyShapes.length;s++){ const P=polyShapes[s].pts;
        for(let i=0;i<P.length-1;i++){ const mid=midOf(P[i],P[i+1]); if(dist(mid,p)<HIT){ P.splice(i+1,0,p); polyReadout(); return; } } }
    }else{ curPoly.push(p); polyReadout(); draw(); }
  }
  else if(mode==='pen'){
    if(editOn){
      for(let s=0;s<penShapes.length;s++){ const sh=penShapes[s];
        for(let i=0;i<sh.anchors.length;i++){ if(dist(sh.anchors[i],p)<HIT){ dragShape=s;dragIdx=i;dragging=true; return; } } }
      for(let s=0;s<penShapes.length;s++){ const sh=penShapes[s];
        for(let i=0;i<sh.anchors.length-1;i++){ const mid=midOf(sh.anchors[i],sh.anchors[i+1]);
          if(dist(mid,p)<HIT){ sh.anchors.splice(i+1,0,p); penReadout(); return; } }
        if(sh.closed&&sh.anchors.length>=3){ const mid=midOf(sh.anchors[sh.anchors.length-1],sh.anchors[0]);
          if(dist(mid,p)<HIT){ sh.anchors.push(p); penReadout(); return; } } }
    }else{ dragging=true; drawBuf=[p]; }
  }
  else if(mode==='angle'||mode==='area'||mode==='circle'){
    pts.push(p);
    if(mode==='angle'&&pts.length===3) computeAngle();
    if(mode==='circle'&&pts.length===3) computeCircle();
    draw();
  }
});

cv.addEventListener('mousemove',e=>{
  const p=pos(e);
  if(mode==='ruler'&&ruler&&rDrag){
    const E=rulerEnds();
    if(rDrag==='len'){ ruler.len=Math.max(20,dist(ruler.x!==undefined?{x:ruler.x,y:ruler.y}:{x:0,y:0},p)); rulerReadout(); }
    else if(rDrag==='rot'){ ruler.angle=Math.atan2(p.y-ruler.y,p.x-ruler.x); rulerReadout(); }
    else if(rDrag==='move'&&rStart){ ruler.x=rStart.ox+(p.x-rStart.mx); ruler.y=rStart.oy+(p.y-rStart.my); clampRuler(); rulerReadout(); }
    draw(); return;
  }
  if(mode==='polyline'&&editOn&&dragging&&pDragShape>=0){ polyShapes[pDragShape].pts[pDragIdx]=p; polyReadout(); return; }
  if(mode==='polyline'&&!editOn&&curPoly.length){ cur=p; polyReadout(); draw(); return; }
  if(mode==='pen'&&editOn&&dragging&&dragShape>=0&&dragIdx>=0){ penShapes[dragShape].anchors[dragIdx]=p; penReadout(); return; }
  if(mode==='pen'&&!editOn&&dragging){ const last=drawBuf[drawBuf.length-1]; if(!last||dist(last,p)>2){ drawBuf.push(p); draw(); } return; }
  cur=p; draw();
});

window.addEventListener('mouseup',()=>{
  if(mode==='pen'&&dragging&&!editOn){ dragging=false; if(drawBuf.length>=3){ commitStroke(); penReadout(); } else drawBuf=[]; }
  dragging=false; pDragShape=-1;pDragIdx=-1;dragShape=-1;dragIdx=-1; rDrag=null; rStart=null;
});

cv.addEventListener('dblclick',e=>{
  const p=pos(e);
  if(mode==='polyline'){
    if(!editOn){ if(curPoly.length>=2){ polyShapes.push({pts:curPoly.slice()}); curPoly=[]; polyReadout(); } }
    else { polyReadout(); }
    draw();
  }
  else if(mode==='area'&&pts.length>=3){ const a=polyArea(pts); setReadout('区域面积', cm(a).toFixed(2)+' cm²', '像素面积 '+a.toFixed(0)+' px² · 顶点 '+pts.length); draw(); }
  else if(mode==='pen'&&editOn){
    let target=penShapes.length-1;
    for(let s=0;s<penShapes.length;s++){ const sh=penShapes[s];
      for(let i=0;i<sh.anchors.length;i++){ if(dist(sh.anchors[i],p)<HIT){ target=s; break; } } }
    if(penShapes[target]&&penShapes[target].anchors.length>=3){ penShapes[target].closed=!penShapes[target].closed; penReadout(); }
  }
});

// ===== 绘制 =====
function drawGrid(){
  ctx.clearRect(0,0,W,H); ctx.strokeStyle='#16222e'; ctx.lineWidth=1;
  const step=pxPerCm*1; if(step>6){
    for(let x=0;x<W;x+=step){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
    for(let y=0;y<H;y+=step){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); } }
}
function dot(p,c){ ctx.fillStyle=c||'#37b0ff'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill(); }
function anchor(p){ ctx.fillStyle='#0f1720'; ctx.strokeStyle='#37b0ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.rect(p.x-4,p.y-4,8,8); ctx.fill(); ctx.stroke(); }
function midMark(p){ ctx.fillStyle='rgba(55,255,155,.85)'; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,7); ctx.fill();
  ctx.strokeStyle='#37ff9b'; ctx.lineWidth=1.5; ctx.beginPath();
  ctx.moveTo(p.x-4,p.y);ctx.lineTo(p.x+4,p.y);ctx.moveTo(p.x,p.y-4);ctx.lineTo(p.x,p.y+4); ctx.stroke(); }
function line(a,b,c){ ctx.strokeStyle=c||'#37ff9b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }
function label(p,t){ ctx.fillStyle='#e8eef4';ctx.font='13px Consolas';ctx.fillText(t,p.x+8,p.y-8); }
function curvePath(P,c){ if(P.length<2) return; ctx.strokeStyle=c||'#37ff9b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); for(const q of P) ctx.lineTo(q.x,q.y); ctx.stroke(); }
function distToSeg(p,a,b){ const vx=b.x-a.x,vy=b.y-a.y; const wx=p.x-a.x,wy=p.y-a.y;
  const c1=vx*wx+vy*wy; if(c1<=0) return dist(p,a); const c2=vx*vx+vy*vy;
  if(c2<=c1) return dist(p,b); const t=c1/c2; return dist(p,{x:a.x+t*vx,y:a.y+t*vy}); }

function drawRuler(){
  if(!ruler) return;
  ctx.save(); ctx.translate(ruler.x,ruler.y); ctx.rotate(ruler.angle);
  const len=ruler.len, h=15;
  ctx.fillStyle='rgba(22,32,44,.92)'; ctx.strokeStyle='#37b0ff'; ctx.lineWidth=1.5;
  ctx.fillRect(0,-h,len,2*h); ctx.strokeRect(0,-h,len,2*h);
  // 刻度：mm 细线，cm 长线+数字
  const mm=pxPerCm/10; let idx=0;
  ctx.strokeStyle='#cfe8ff'; ctx.fillStyle='#cfe8ff'; ctx.font='11px Consolas';
  for(let x=0; x<=len; x+=mm){
    const isCm = (idx%10===0);
    const tick = isCm?11:5;
    ctx.beginPath(); ctx.moveTo(x,-h); ctx.lineTo(x,-h+tick); ctx.stroke();
    if(isCm){ ctx.fillText(String(idx/10), x+2, 2); }
    idx++;
  }
  // 端点手柄
  ctx.fillStyle='#ffb020'; ctx.fillRect(len-6,-6,12,12);       // 右端：改长度
  ctx.fillStyle='#37ff9b'; ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill(); // 左端：旋转
  ctx.restore();
  const E=rulerEnds(); label(E.r, cm(len).toFixed(2)+' cm');
}

function draw(){
  drawGrid();
  if(mode==='ruler'){ drawRuler(); }
  else if(mode==='polyline'){
    for(let s=0;s<polyShapes.length;s++){ const P=polyShapes[s].pts;
      for(let i=1;i<P.length;i++) line(P[i-1],P[i]);
      P.forEach(p=>dot(p));
      if(editOn){ for(let i=0;i<P.length-1;i++) midMark(midOf(P[i],P[i+1])); P.forEach(p=>anchor(p)); } }
    if(!editOn&&curPoly.length){ for(let i=1;i<curPoly.length;i++) line(curPoly[i-1],curPoly[i]);
      if(cur) line(curPoly[curPoly.length-1],cur,'#1f6b4a'); curPoly.forEach(p=>dot(p)); }
  }
  else if(mode==='pen'){
    for(let s=0;s<penShapes.length;s++){ const sh=penShapes[s]; if(sh.anchors.length<2) continue;
      const closed=sh.closed&&sh.anchors.length>=3; const dense=catmullRom(sh.anchors,closed,10); curvePath(dense);
      if(closed){ ctx.strokeStyle='rgba(55,255,155,.5)'; ctx.lineWidth=1; ctx.beginPath();
        ctx.moveTo(sh.anchors[sh.anchors.length-1].x,sh.anchors[sh.anchors.length-1].y);
        ctx.lineTo(sh.anchors[0].x,sh.anchors[0].y); ctx.stroke(); }
      if(editOn){ for(let i=0;i<sh.anchors.length-1;i++) midMark(midOf(sh.anchors[i],sh.anchors[i+1]));
        if(closed) midMark(midOf(sh.anchors[sh.anchors.length-1],sh.anchors[0])); sh.anchors.forEach(p=>anchor(p)); } }
    if(!editOn&&drawBuf.length>1){ curvePath(drawBuf,'#6fd0ff'); }
  }
  else if(mode==='angle'&&pts.length){ for(let i=1;i<pts.length;i++)line(pts[i-1],pts[i]); pts.forEach((p,i)=>dot(p,i===1?'#ffb020':'#37b0ff')); }
  else if(mode==='area'&&pts.length){ for(let i=1;i<pts.length;i++)line(pts[i-1],pts[i]); pts.forEach(p=>dot(p)); }
  else if(mode==='circle'&&pts.length){ pts.forEach(p=>dot(p)); const c=circleFrom3(pts[0],pts[1],pts[2]);
    if(c&&pts.length===3){ ctx.strokeStyle='#37ff9b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.cx,c.cy,c.r,0,7);ctx.stroke(); dot({x:c.cx,y:c.cy},'#ffb020'); } }
}

// ===== 校准 =====
document.getElementById('calBtn').onclick=()=>{
  if(!ruler){ alert('请先切换到“直尺”模式生成一把尺子，把它拉到与银行卡等长后再校准。'); return; }
  if(ruler.len<20){ alert('尺子太短，请拖右端拉长到与银行卡等长后再校准。'); return; }
  pxPerCm=ruler.len/8.56;
  document.getElementById('ratio').textContent=pxPerCm.toFixed(2);
  document.getElementById('calBadge').textContent='已按银行卡校准';
  rulerReadout(); draw();
};
document.getElementById('resetBtn').onclick=clearCurrent;

resize();
document.getElementById('hint').innerHTML=hints.ruler;
rulerReadout();
</script>
